server.port=8080

# Spring Application Name
spring.application.name=certificate-verification-system

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cert_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Blockchain Hardhat Configuration (Default Hardhat node: http://127.0.0.1:8545)
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
blockchain.gas-limit=500000
blockchain.gas-price=20000000000

# Frontend URL for Verification QR Link
app.frontend.verify-url=${FRONTEND_VERIFY_URL:http://localhost:5173/verify}
app.institution-name=${INSTITUTION_NAME:ABC University}

# Logging
logging.level.com.certificate.verification=INFO
logging.level.org.springframework.security=INFO
